name: Frontend checks

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find js -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done

      - name: Run frontend regression tests
        run: node --test tests/*.test.js

      - name: Verify local assets and CSS block balance
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const html = fs.readFileSync('index.html', 'utf8');
          const refs = [...html.matchAll(/(?:src|href)=["']([^"']+)["']/g)]
            .map(match => match[1].split('?')[0].split('#')[0])
            .filter(ref => /^(css|js)\//.test(ref));
          const missing = refs.filter(ref => !fs.existsSync(ref));
          if (missing.length) {
            console.error('Missing local assets:', missing.join(', '));
            process.exit(1);
          }

          const cssFiles = fs.readdirSync('css')
            .filter(file => file.endsWith('.css'))
            .map(file => path.join('css', file));
          for (const file of cssFiles) {
            const source = fs.readFileSync(file, 'utf8')
              .replace(/\/\*[\s\S]*?\*\//g, '')
              .replace(/"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'/g, '""');
            let depth = 0;
            for (const char of source) {
              if (char === '{') depth++;
              if (char === '}') depth--;
              if (depth < 0) throw new Error(file + ': unexpected closing brace');
            }
            if (depth !== 0) throw new Error(file + ': unbalanced CSS braces (' + depth + ')');
          }
          console.log('All referenced assets exist and CSS braces are balanced.');
          NODE

      - name: Verify write-enabled E2E fails closed without staging API
        shell: bash
        run: |
          set -euo pipefail
          set +e
          env -u PMS_STAGING_API_BASE_URL -u PMS_TEST_USERNAME -u PMS_TEST_PASSWORD \
            node scripts/pms-staging-production-procurement-e2e.cjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected E2E to stop when no isolated staging API is configured."
            exit 1
          fi
          node -e "const r=require('./test-results/staging-e2e-report.json'); if (!/PMS_STAGING_API_BASE_URL/.test(r.error || '') || Object.keys(r.created || {}).length) { console.error('E2E safety guard did not fail closed', r); process.exit(1); } console.log('E2E safety guard passed: no API target, no records created.');"
