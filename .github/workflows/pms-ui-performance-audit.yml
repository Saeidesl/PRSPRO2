name: PMS comprehensive UI performance audit

on:
  push:
    branches: [main]
    paths-ignore:
      - 'test-results/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'PMS URL to audit (use a staging URL for authenticated tests)'
        required: false
        type: string
      scope:
        description: 'Audit scope'
        required: true
        default: 'procurement'
        type: choice
        options:
          - procurement
          - all

permissions:
  contents: write
  actions: read

concurrency:
  group: pms-ui-performance-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run real-browser project modal keyboard tests
        run: node tests/project-modal-accessibility.browser.cjs


      - name: Serve the checked-out frontend
        if: ${{ !inputs.base_url && !vars.PMS_BASE_URL }}
        run: |
          node scripts/serve-pms-audit.cjs > /tmp/pms-audit-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/PRSPRO2/ > /dev/null; then
              echo "Current checkout is ready for browser audit."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pms-audit-server.log
          exit 1

      - name: Run UI inventory and performance audit
        env:
          PMS_BASE_URL: ${{ inputs.base_url || vars.PMS_STAGING_BASE_URL || vars.PMS_BASE_URL || 'http://127.0.0.1:4173/PRSPRO2/' }}
          PMS_AUDIT_SCOPE: ${{ inputs.scope || 'all' }}
          PMS_PERFORMANCE_DIAGNOSTICS: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.scope == 'procurement') && '1' || '0' }}
          PMS_STAGING_API_BASE_URL: ${{ secrets.PMS_STAGING_API_BASE_URL }}
          PMS_TEST_USERNAME: ${{ secrets.PMS_TEST_USERNAME }}
          PMS_TEST_PASSWORD: ${{ secrets.PMS_TEST_PASSWORD }}
        run: node scripts/pms-ui-performance-audit.cjs

      - name: Upload full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pms-ui-performance-audit-${{ github.run_number }}
          path: |
            test-results/latest-performance-report.json
            test-results/latest-performance-report.md
          if-no-files-found: warn
          retention-days: 90

      - name: Persist latest report in repository
        if: github.event_name != 'pull_request' && always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f test-results/latest-performance-report.json ]; then
            echo '{"overallStatus":"runner-error","note":"Audit runner did not produce a report."}' > test-results/latest-performance-report.json
          fi
          mkdir -p /tmp/pms-audit-report
          cp test-results/latest-performance-report.json /tmp/pms-audit-report/latest-performance-report.json
          if [ -f test-results/latest-performance-report.md ]; then
            cp test-results/latest-performance-report.md /tmp/pms-audit-report/latest-performance-report.md
          else
            printf '# PMS UI and Performance Audit\n\n- Overall: **runner-error**\n- The audit runner did not produce a Markdown report.\n' > /tmp/pms-audit-report/latest-performance-report.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Build the report commit on the latest main and retry if another QA run
          # pushes while this audit is finishing.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p test-results
            cp /tmp/pms-audit-report/latest-performance-report.json test-results/latest-performance-report.json
            cp /tmp/pms-audit-report/latest-performance-report.md test-results/latest-performance-report.md
            git add test-results/latest-performance-report.json test-results/latest-performance-report.md
            if git diff --cached --quiet; then
              echo "Report unchanged; no repository commit needed."
              exit 0
            fi
            git commit -m "test: update latest PMS performance audit report [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Report push raced with another main update (attempt $attempt/3); retrying."
            sleep 2
          done
          echo "Unable to persist audit report after three attempts." >&2
          exit 1
