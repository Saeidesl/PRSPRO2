name: PMS comprehensive UI performance audit

on:
  push:
    branches: [main]
    paths-ignore:
      - 'test-results/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'PMS URL to audit (use a staging URL for authenticated tests)'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: pms-ui-performance-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run UI inventory and performance audit
        env:
          PMS_BASE_URL: ${{ inputs.base_url || vars.PMS_BASE_URL || 'https://saeidesl.github.io/PRSPRO2/' }}
          PMS_TEST_USERNAME: ${{ secrets.PMS_TEST_USERNAME }}
          PMS_TEST_PASSWORD: ${{ secrets.PMS_TEST_PASSWORD }}
        run: node scripts/pms-ui-performance-audit.cjs

      - name: Upload full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pms-ui-performance-audit-${{ github.run_number }}
          path: |
            test-results/latest-performance-report.json
            test-results/latest-performance-report.md
          if-no-files-found: warn
          retention-days: 90

      - name: Persist latest report in repository
        if: github.event_name != 'pull_request' && always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f test-results/latest-performance-report.json ]; then
            echo '{"overallStatus":"runner-error","note":"Audit runner did not produce a report."}' > test-results/latest-performance-report.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-results/latest-performance-report.json test-results/latest-performance-report.md
          if git diff --cached --quiet; then
            echo "Report unchanged; no repository commit needed."
          else
            git commit -m "test: update latest PMS performance audit report [skip ci]"
            git push
          fi
