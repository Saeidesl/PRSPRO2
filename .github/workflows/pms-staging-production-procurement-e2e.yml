name: PMS staging production-to-procurement E2E
# Re-run after project-scoped partial receipt request was corrected.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pms-staging-production-procurement-e2e.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pms-staging-production-procurement-e2e
  cancel-in-progress: false

jobs:
  staging-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run staging production-to-procurement scenario
        env:
          PMS_BASE_URL: ${{ vars.PMS_STAGING_BASE_URL || vars.PMS_BASE_URL || 'https://saeidesl.github.io/PRSPRO2/' }}
          PMS_STAGING_API_BASE_URL: ${{ secrets.PMS_STAGING_API_BASE_URL }}
          PMS_TEST_USERNAME: ${{ secrets.PMS_TEST_USERNAME }}
          PMS_TEST_PASSWORD: ${{ secrets.PMS_TEST_PASSWORD }}
        run: node scripts/pms-staging-production-procurement-e2e.cjs
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pms-staging-production-procurement-e2e-${{ github.run_number }}
          path: |
            test-results/staging-e2e-report.json
            test-results/staging-e2e-report.md
          if-no-files-found: warn
          retention-days: 90
      - name: Persist E2E report in repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f test-results/staging-e2e-report.json ]; then
            echo '{"status":"runner-error","error":"E2E runner did not produce a report."}' > test-results/staging-e2e-report.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"
          report_json="$RUNNER_TEMP/staging-e2e-report.json"
          report_md="$RUNNER_TEMP/staging-e2e-report.md"
          cp test-results/staging-e2e-report.json "$report_json"
          if [ -f test-results/staging-e2e-report.md ]; then
            cp test-results/staging-e2e-report.md "$report_md"
          else
            printf '# Staging E2E report\n\nMarkdown report was not generated; inspect the JSON report.\n' > "$report_md"
          fi

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p test-results
            cp "$report_json" test-results/staging-e2e-report.json
            cp "$report_md" test-results/staging-e2e-report.md
            git add test-results/staging-e2e-report.json test-results/staging-e2e-report.md

            if git diff --cached --quiet; then
              echo "E2E report unchanged."
              exit 0
            fi

            git commit -m "test: persist staging E2E report [skip ci]"
            if git push origin HEAD:main; then
              echo "E2E report persisted successfully on attempt $attempt."
              exit 0
            fi

            echo "Report push conflicted with another main-branch update (attempt $attempt/3)." >&2
            sleep $((attempt * 2))
          done

          echo "Unable to persist E2E report after 3 attempts." >&2
          exit 1
