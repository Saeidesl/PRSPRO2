name: Publish staging frontend to GitHub Pages

on:
  push:
    branches:
      - feature/design-case-preproduction
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-staging
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/design-case-preproduction

      - name: Verify static app entry point
        run: |
          test -f index.html
          test -f js/core/api.js
          echo "Static frontend entry point and API configuration found."

      - name: Upload frontend files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish staging frontend
        id: deployment
        uses: actions/deploy-pages@v4
