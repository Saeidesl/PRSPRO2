name: Publish staging frontend to GitHub Pages

on:
  push:
    branches:
      - feature/design-case-preproduction
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-staging
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/design-case-preproduction

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload frontend files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish staging frontend
        id: deployment
        uses: actions/deploy-pages@v4
