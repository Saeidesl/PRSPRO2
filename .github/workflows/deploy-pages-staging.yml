name: Publish frontend to GitHub Pages (MAIN)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main frontend
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify production entry points
        run: |
          test -f index.html
          test -f js/core/api.js
          echo "Main branch frontend is ready for GitHub Pages."

      - name: Cancel confirmed stale Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const staleDeployment = '424ed19809722b366732fbca6a30431d5130d66e';
            try {
              await github.request(
                'POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pages_deployment_id: staleDeployment
                }
              );
              core.info(`Cancelled stale Pages deployment ${staleDeployment}.`);
            } catch (error) {
              if (error.status === 404) {
                core.info('The stale Pages deployment is already cleared.');
              } else {
                throw error;
              }
            }

      - name: Upload production Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publish main branch to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
