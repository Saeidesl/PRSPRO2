name: Publish staging frontend to GitHub Pages

on:
  push:
    branches:
      - feature/design-case-preproduction
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-staging
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production site
        uses: actions/checkout@v4
        with:
          ref: main
          path: _site

      - name: Checkout staging frontend into isolated path
        uses: actions/checkout@v4
        with:
          ref: feature/design-case-preproduction
          path: _site/staging

      - name: Verify both app entry points
        run: |
          test -f _site/index.html
          test -f _site/staging/index.html
          test -f _site/staging/js/core/api.js
          echo "Production root preserved; staging app prepared under /staging/."

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish staging alongside production
        id: deployment
        uses: actions/deploy-pages@v4
