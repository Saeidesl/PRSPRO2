name: PMS cross-repository QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pms-cross-repo-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-and-backend:
    name: Validate frontend and backend together
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: frontend

      - name: Checkout backend reference
        uses: actions/checkout@v4
        with:
          repository: Saeidesl/PRSPRO2BACKEND
          ref: main
          path: backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find frontend/js -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Verify frontend assets and CSS structure
        shell: bash
        run: |
          set -euo pipefail
          cd frontend
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const html = fs.readFileSync('index.html', 'utf8');
          const refs = [...html.matchAll(/(?:src|href)=["']([^"']+)["']/g)]
            .map(match => match[1].split('?')[0].split('#')[0])
            .filter(ref => /^(css|js)\//.test(ref));
          const missing = refs.filter(ref => !fs.existsSync(ref));
          if (missing.length) {
            console.error('Missing local assets:', missing.join(', '));
            process.exit(1);
          }
          for (const file of fs.readdirSync('css').filter(file => file.endsWith('.css'))) {
            const fullPath = path.join('css', file);
            const source = fs.readFileSync(fullPath, 'utf8')
              .replace(/\/\*[\s\S]*?\*\//g, '')
              .replace(/"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'/g, '""');
            let depth = 0;
            for (const char of source) {
              if (char === '{') depth++;
              if (char === '}') depth--;
              if (depth < 0) throw new Error(fullPath + ': unexpected closing brace');
            }
            if (depth !== 0) throw new Error(fullPath + ': unbalanced CSS braces (' + depth + ')');
          }
          console.log('Frontend assets exist and CSS braces are balanced.');
          NODE

      - name: Run backend unit and integration tests
        working-directory: backend
        run: node --test tests/*.test.js

      - name: Validate backend manifest and Apps Script source
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          test -f appsscript.json
          node -e "JSON.parse(require('fs').readFileSync('appsscript.json', 'utf8'));"
          count=0
          declare -A names=()
          for file in *.js; do
            [ -f "$file" ] || continue
            node --check "$file"
            name="${file%.js}"
            name="${name%.gs}"
            if [[ -n "${names[$name]+x}" ]]; then
              echo "Duplicate Apps Script target name: $name.gs"
              exit 1
            fi
            names["$name"]=1
            count=$((count + 1))
          done
          if [ "$count" -lt 60 ]; then
            echo "Expected at least 60 backend source files, found $count."
            exit 1
          fi
          echo "Validated $count backend source files and appsscript.json."

      - name: Verify critical production-to-material-planning components exist
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/js/modules/events.js
          test -f frontend/js/modules/material-planning.js
          test -f backend/EventService.js
          test -f backend/ProcurementEventIntegrationService.js
          test -f backend/MaterialPlanningService.js
          echo "Critical event and material-planning components are present in both repositories."
