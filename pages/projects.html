<section class="page-section projects-page" aria-labelledby="projects-page-title">

  <header class="page-header projects-page-header">
    <div class="projects-page-heading">
      <span class="projects-page-eyebrow">مدیریت تولید</span>
      <h2 id="projects-page-title">پروژه‌ها</h2>
      <p>مدیریت و پیگیری پروژه‌های تولید</p>
    </div>

    <div class="page-header-actions">
      <button
        type="button"
        class="btn btn-primary"
        id="project-create-button"
      >
        <span aria-hidden="true">+</span>
        پروژه جدید
      </button>
    </div>
  </header>

  <section class="card projects-list-panel" aria-label="فهرست و جستجوی پروژه‌ها">
    <div class="card-body">

      <div class="filter-bar projects-filter-bar">
        <div class="filter-group">
          <label for="project-status-filter">فیلتر بر اساس وضعیت</label>
          <select id="project-status-filter" aria-label="فیلتر پروژه‌ها بر اساس وضعیت">
            <option value="">همه وضعیت‌ها</option>
            <option value="ACTIVE">فعال</option>
            <option value="ON_HOLD">متوقف</option>
            <option value="COMPLETED">تکمیل‌شده</option>
            <option value="CANCELLED">لغوشده</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="project-search">جستجوی پروژه</label>
          <input
            type="search"
            id="project-search"
            placeholder="جستجو با کد یا عنوان پروژه..."
            autocomplete="off"
            aria-label="جستجو در کد یا عنوان پروژه"
          >
        </div>
      </div>

      <div
        id="projects-loading"
        class="loading-state"
        role="status"
        aria-live="polite"
      >
        در حال بارگذاری پروژه‌ها...
      </div>

      <div
        id="projects-error"
        class="alert alert-danger"
        role="alert"
        aria-live="assertive"
        hidden
      ></div>

      <div
        id="projects-table-container"
        class="table-wrapper"
        aria-live="polite"
        aria-busy="false"
        hidden
      ></div>

      <div
        id="projects-empty"
        class="table-empty"
        role="status"
        hidden
      >
        پروژه‌ای برای نمایش وجود ندارد.
      </div>

    </div>
  </section>

</section>
