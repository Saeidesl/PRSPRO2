<div class="login-page">
  <div class="login-card">
    <button type="button" class="theme-toggle login-theme-toggle" data-theme-toggle aria-label="تغییر به تم تیره" aria-pressed="false">
      <span class="theme-toggle-icon" aria-hidden="true">☾</span>
      <span class="theme-toggle-label">تیره</span>
    </button>
    <div class="login-header">
      <div class="login-logo">PRS</div>
      <h1>سامانه مدیریت تولید</h1>
      <p>ورود به سامانه</p>
    </div>

    <form id="login-form" class="login-form">
      <div class="form-group">
        <label for="login-username">نام کاربری</label>
        <input
          id="login-username"
          name="username"
          type="text"
          autocomplete="username"
          placeholder="نام کاربری را وارد کنید"
          required
        >
      </div>

      <div class="form-group">
        <label for="login-password">رمز عبور</label>
        <input
          id="login-password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="رمز عبور را وارد کنید"
          required
        >
      </div>

      <div id="login-error" class="login-error hidden"></div>

      <button id="login-button" type="submit" class="login-button">
        ورود
      </button>
    </form>
  </div>
</div>

<script src="js/modules/auth.js"></script>
